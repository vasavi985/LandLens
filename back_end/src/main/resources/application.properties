# Spring Application Name
spring.application.name=landlens
server.port=${PORT:8080}

# Firebase Properties
firebase.api.key=${FIREBASE_API_KEY}
firebase.project.id=${FIREBASE_PROJECT_ID}
firebase.credentials.json=${FIREBASE_CREDENTIALS_JSON}

# Spring Security Basic Disable
spring.security.basic.enabled=false

# JWT Properties (with environment variables and development defaults)
landlens.jwt.secret=${JWT_SECRET:9a2f3f4e5d6c7b8a9f0e1d2c3b4a5f6e7d8c9b0a1f2e3d4c5b6a7f8e9d0c1b2a3}
landlens.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
landlens.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# Actuator Endpoints Config (Health Check & Metrics)
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

openai.api.key=${OPENAI_API_KEY:YOUR_NVIDIA_API_KEY_HERE}